version: "3.8"

services:
  app:
    build: .
    container_name: laravel_app
    restart: always
    working_dir: /var/www
    depends_on:
      - mysql
      - redis
    volumes:
      - laravel_public:/var/www/public

    environment:
      APP_NAME: Laravel
      APP_ENV: production
      APP_KEY: base64:YWKloITJTcEGmk1D+q4y2yg90Ht5alFC/esd7REF6T0=
      APP_DEBUG: true
      APP_URL: http://localhost

      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database

      MAIL_MAILER: log

      SCOUT_DRIVER: null
  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      # - .:/var/www
      - laravel_public:/var/www/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: redis
    restart: always

volumes:
  mysql_data:
  laravel_public:
